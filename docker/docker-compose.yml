services:
  postgres:
    image: postgres:16-alpine
    container_name: webhook-postgres
    environment:
      POSTGRES_DB: webhook_db
      POSTGRES_USER: engine_user
      POSTGRES_PASSWORD: engine_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7.2-alpine
    container_name: webhook-redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: heidiks/rabbitmq-delayed-message-exchange:3.13-management
    container_name: webhook-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"   # AMQP protocol
      - "15672:15672" # Web Management Dashboard

  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: webhook-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

volumes:
  pgdata:
